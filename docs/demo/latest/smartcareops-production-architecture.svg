      .node { fill: #e6f3ff; stroke: #bdd9ed; stroke-width: 1.25; }
      .node2 { fill: #f1f8ff; stroke: #c9dfea; stroke-width: 1.25; }
      .prepared { fill: #fff8e8; stroke: #d6a23d; stroke-width: 1.35; stroke-dasharray: 6 4; }
      .planned { fill: #f6f8fa; stroke: #aeb8c0; stroke-width: 1.25; stroke-dasharray: 6 4; }
      .data { fill: #eaf6ff; stroke: #bfd8e8; stroke-width: 1.25; }
      .heading { font: 700 24px Inter,Segoe UI,Arial,sans-serif; fill: #073b61; }
      .subtitle { font: 500 13px Inter,Segoe UI,Arial,sans-serif; fill: #527286; }
      .title { font: 700 13px Inter,Segoe UI,Arial,sans-serif; fill: #075d91; }
      .small { font: 500 11px Inter,Segoe UI,Arial,sans-serif; fill: #37667f; }
      .tiny { font: 600 10px Inter,Segoe UI,Arial,sans-serif; fill: #527286; }
      .edge { fill: none; stroke: #9aa8b2; stroke-width: 1.35; marker-end: url(#arrow); }
      .link { fill: none; stroke: #9aa8b2; stroke-width: 1.35; }
      .event { fill: none; stroke: #6e9fbb; stroke-width: 1.45; marker-end: url(#arrowBlue); }
      .dash { fill: none; stroke: #aab5bd; stroke-width: 1.2; stroke-dasharray: 5 5; marker-end: url(#arrow); }
      .prepared-edge { fill: none; stroke: #d6a23d; stroke-width: 1.35; stroke-dasharray: 6 4; marker-end: url(#arrowGold); }
      .planned-edge { fill: none; stroke: #aeb8c0; stroke-width: 1.25; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .label-bg { fill: #fff; stroke: #d5e4ee; stroke-width: 1; }
      .section-label-bg { fill: #fff; }
      .label { font: 600 10px Inter,Segoe UI,Arial,sans-serif; fill: #28749f; }
      .icon-bg { fill: #fff; opacity: .78; }
      .status-ok { font: 600 10px Inter,Segoe UI,Arial,sans-serif; fill: #18745d; }
      .status-local { font: 600 10px Inter,Segoe UI,Arial,sans-serif; fill: #9a6412; }
      .status-plan { font: 600 10px Inter,Segoe UI,Arial,sans-serif; fill: #687680; }
